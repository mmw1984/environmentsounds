<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="環境聲音集合">
    <title>環境聲音</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>17 款環境聲音</h1>
        <p class="subtitle">Made by 黃梓峰 and 鄧煒霖</p>
    </header>

    <main>
        <nav class="categories">
            <button class="category-btn active" data-category="all">全部</button>
            <button class="category-btn" data-category="nature">自然</button>
            <button class="category-btn" data-category="urban">非自然</button>
            <button class="category-btn" data-category="animals">動物</button>

        </nav>

        <section class="sound-grid">
            <!-- Nature Sounds -->
            <div class="sound-container" data-category="nature">
                <div class="sound-info">
                    <h2 class="sound-name">小溪聲</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/小溪聲.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="nature">
                <div class="sound-info">
                    <h2 class="sound-name">打雷聲</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/打雷聲.mp3" type="audio/mpeg">
                </audio>
            </div>

            <!-- Urban Sounds -->
            <div class="sound-container" data-category="urban">
                <div class="sound-info">
                    <h2 class="sound-name">救護車聲音</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/救護車聲音香港.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="urban">
                <div class="sound-info">
                    <h2 class="sound-name">敲打鍵盤</h2>

                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/敲打鍵盤.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="urban">
                <div class="sound-info">
                    <h2 class="sound-name">步行聲</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/步行聲.mp3" type="audio/mpeg">
                </audio>
            </div>

            <!-- More Nature Sounds -->
            <div class="sound-container" data-category="nature">
                <div class="sound-info">
                    <h2 class="sound-name">浪聲</h2>
                </div>

                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/浪聲.mp3" type="audio/mpeg">

                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/硬幣跌落.mp3" type="audio/mpeg">

            <div class="sound-container" data-category="nature">

                </div>

    <footer>
        <p class="author">Copyright 2024 mmw1984.com</p>
        <p class="repo-link">Github：<a href="https://github.com/mmw1984/environmentsounds" target="_blank">mmw1984/environmentsounds</a></p>
