<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="香港環境聲音集合 - 自然、城市和動物聲音">
    <meta name="keywords" content="環境聲音, 香港, 自然聲音, 動物聲音, 城市聲音">
    <title>環境聲音 | Hong Kong Environmental Sounds</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Add favicon -->
    <link rel="icon" type="image/png" href="favicon.ico">
</head>
<body>
    <header>
        <h1>香港環境聲音集合</h1>
        <p class="subtitle">Hong Kong Environmental Sounds Collection</p>
    </header>

    <main>
        <nav class="categories">
            <button class="category-btn active" data-category="all">全部 All</button>
            <button class="category-btn" data-category="nature">自然 Nature</button>
            <button class="category-btn" data-category="urban">城市 Urban</button>
            <button class="category-btn" data-category="animals">動物 Animals</button>
        </nav>

        <section class="sound-grid" role="region" aria-label="聲音集合">
            <!-- Nature Sounds -->
            <div class="sound-container" data-category="nature">
                <div class="sound-info">
                    <h2 class="sound-name">小溪聲 Stream</h2>
                    <p class="sound-description">流水聲 Running Water</p>
                </div>
                <audio controls preload="none">
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/小溪聲.mp3" type="audio/mpeg">
                    <p>您的瀏覽器不支持音頻元素。Your browser doesn't support audio playback.</p>
                </audio>
            </div>
            <!-- Continue with other sounds following the same pattern -->
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p class="author">聲音作者 Authors：黃梓峰、鄧煒霖</p>
            <p class="repo-link">聲音來源 Source：<a href="https://github.com/mmw1984/environmentsounds" target="_blank" rel="noopener noreferrer">GitHub Repository</a></p>
            <p class="disclaimer">© 2024 環境聲音. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
