<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="香港環境聲音集合 - 自然、城市和動物聲音">
    <title>環境聲音 | Hong Kong Environmental Sounds</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>香港環境聲音集合</h1>
        <p class="subtitle">Hong Kong Environmental Sounds Collection</p>
    </header>

    <main>
        <nav class="categories">
            <button class="category-btn active" data-category="all">全部 All</button>
            <button class="category-btn" data-category="nature">自然 Nature</button>
            <button class="category-btn" data-category="urban">城市 Urban</button>
            <button class="category-btn" data-category="animals">動物 Animals</button>
        </nav>

        <section class="sound-grid">
            <!-- Nature Sounds -->
            <div class="sound-container" data-category="nature">
                <div class="sound-info">
                    <h2 class="sound-name">小溪聲 Stream</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/小溪聲.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="nature">
                <div class="sound-info">
                    <h2 class="sound-name">打雷聲 Thunder</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/打雷聲.mp3" type="audio/mpeg">
                </audio>
            </div>

            <!-- Urban Sounds -->
            <div class="sound-container" data-category="urban">
                <div class="sound-info">
                    <h2 class="sound-name">救護車聲音 Ambulance</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/救護車聲音香港.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="urban">
                <div class="sound-info">
                    <h2 class="sound-name">敲打鍵盤 Keyboard</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/敲打鍵盤.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="urban">
                <div class="sound-info">
                    <h2 class="sound-name">步行聲 Footsteps</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/步行聲.mp3" type="audio/mpeg">
                </audio>
            </div>

            <!-- More Nature Sounds -->
            <div class="sound-container" data-category="nature">
                <div class="sound-info">
                    <h2 class="sound-name">浪聲 Waves</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/浪聲.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="urban">
                <div class="sound-info">
                    <h2 class="sound-name">炸彈爆炸 Explosion</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/炸彈爆炸.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="urban">
                <div class="sound-info">
                    <h2 class="sound-name">硬幣跌落 Coin Drop</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/硬幣跌落.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="nature">
                <div class="sound-info">
                    <h2 class="sound-name">雨聲 Rain</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/雨聲.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="nature">
                <div class="sound-info">
                    <h2 class="sound-name">雷雨聲 Thunderstorm</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/雷雨聲.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="nature">
                <div class="sound-info">
                    <h2 class="sound-name">風聲 Wind</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/風聲.mp3" type="audio/mpeg">
                </audio>
            </div>

            <!-- Animal Sounds -->
            <div class="sound-container" data-category="animals">
                <div class="sound-info">
                    <h2 class="sound-name">貓 Cat</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/cat.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="animals">
                <div class="sound-info">
                    <h2 class="sound-name">狗 Dog</h2>
                </div>

                </audio>
            </div>

            <div class="sound-container" data-category="animals">
                <div class="sound-info">
                    <h2 class="sound-name">貓頭鷹 Owl</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/owl.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="animals">
                <div class="sound-info">
                    <h2 class="sound-name">豬 Pig</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/pig.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="sound-container" data-category="animals">
                <div class="sound-info">
                    <h2 class="sound-name">牛 Cow</h2>
                </div>
                <audio controls>
                    <source src="https://github.com/mmw1984/environmentsounds/raw/refs/heads/gh-pages/cow.mp3" type="audio/mpeg">
                </audio>
            </div>
        </section>
    </main>

    <footer>
        <p class="author">聲音作者：黃梓峰、鄧煒霖</p>
        <p class="repo-link">聲音來源：<a href="https://github.com/mmw1984/environmentsounds" target="_blank">GitHub Repository</a></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
